<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Summary Page</title>
<link rel="stylesheet" href="summry.css">
</head>

<body>

<div class="container">

    <!-- Navbar -->
    <div class="navbar">
        <h2>Summary Page</h2>
    </div>


    <!-- Course Info -->
    <div class="card">
        <h3>Course Title</h3>

        <div class="comments">
            <span>Total Comments</span>
            <div class="line"></div>
            <div class="line"></div>
        </div>
    </div>


    <!-- Positive & Negative -->
    <div class="grid">

        <div class="card">
            <h3>Top Positive Points</h3>
            <ul>
                <li>Positive Point</li>
                <li>Positive Point</li>
            </ul>
        </div>

        <div class="card">
            <h3>Top Negative Points</h3>
            <ul>
                <li>Negative Point</li>
                <li>Negative Point</li>
            </ul>
        </div>

    </div>


    <!-- Recurring Issues -->
    <div class="card">

        <h3>Recurring Issues</h3>

        <div class="issue">
            <span>Issue 1</span>

            <div class="progress-group">
                <label>Positive %</label>
                <div class="progress">
                    <div class="positive"></div>
                </div>

                <label>Negative %</label>
                <div class="progress">
                    <div class="negative"></div>
                </div>
            </div>

        </div>

        <div class="issue">
            <span>Issue 2</span>
        </div>

    </div>

</div>

</body>
</html>
