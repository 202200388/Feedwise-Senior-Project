<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Course Comparison</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<div class="navbar">
<h2>Automated Academic Feedback Summarizer</h2>
</div>

<div class="controls">
<select>
<option>Select Course 1</option>
</select>

<select>
<option>Select Course 2</option>
</select>
</div>

<div class="card">

<div class="compare-grid">

<div class="course">
<h3>Course Title 1</h3>

<p>Positive %</p>
<div class="progress">
<div class="positive" style="width:70%"></div>
</div>

</div>

<div class="course">
<h3>Course Title 2</h3>

<p>Negative %</p>
<div class="progress">
<div class="negative" style="width:40%"></div>
</div>

</div>

</div>

<p class="result">
Course 1 has better overall feedback
</p>

</div>

</div>

</body>
</html>
