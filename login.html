<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FeedWise | Sign In</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <div class="login-page">

    <header class="navbar">
      <div class="brand">
        <img src="feedwise-logo.png" alt="FeedWise Logo" class="brand-logo" />

        <div class="brand-text">
          <h2>Feed<span>Wise</span></h2>
          <p>Smart Feedback Analysis</p>
        </div>
      </div>

      <div class="nav-buttons">
        <a href="login.html" class="nav-link active">Sign In</a>
        <a href="register.html" class="nav-btn">Register</a>
      </div>
    </header>

    <main class="login-container">
      <div class="login-card">

        <div class="login-left">
          <h1>Welcome Back</h1>
          <p class="subtitle">Sign in to your FeedWise account</p>

          <form>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter your email" />

            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter your password" />

            <div class="options">
              <label class="remember-me">
                <input type="checkbox" />
                <span>Remember me</span>
              </label>

              <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="primary-btn">Sign In</button>
          </form>

          <p class="bottom-text">
            Don’t have an account?
            <a href="register.html">Register</a>
          </p>
        </div>

        <div class="login-right">
          <div class="visual-box">
            <img src="feedwise-logo.png" alt="FeedWise Logo" class="login-logo" />
            <p>Smart AI-powered feedback analysis</p>
          </div>
        </div>

      </div>
    </main>

  </div>

</body>
</html>
