<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link rel="stylesheet" href="feedback.css">
</head>

<body>

<div class="dashboard">

    <!-- Top Navbar -->
    <div class="navbar">
        <div class="logo">
            👥 Automated Academic Feedback Summarizer
        </div>

        <div class="nav-buttons">
            <button>Upload Feedback</button>
            <button>View Summary</button>
            <button>Compare Courses</button>
        </div>
    </div>


    <!-- Cards -->
    <div class="cards">

        <div class="card">
            <h3>Total Courses</h3>
            <p>25</p>
        </div>

        <div class="card">
            <h3>Total Feedback</h3>
            <p>320</p>
        </div>

        <div class="card">
            <h3>Positive Feedback</h3>
            <p>250</p>
        </div>

        <div class="card">
            <h3>Negative Feedback</h3>
            <p>70</p>
        </div>

    </div>


    <!-- Charts -->
    <div class="charts">

        <div class="chart-box">
            <h3>Sentiment Analysis</h3>
            <div class="circle"></div>
        </div>

        <div class="chart-box">
            <h3>Feedback by Course</h3>

            <div class="bars">
                <div class="bar" style="height:40%"></div>
                <div class="bar" style="height:55%"></div>
                <div class="bar" style="height:35%"></div>
                <div class="bar" style="height:70%"></div>
                <div class="bar" style="height:50%"></div>
                <div class="bar" style="height:80%"></div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
