<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upload Feedback</title>
<link rel="stylesheet" href="uploud.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h2>Select Course</h2>
    </div>

    <div class="upload-box">

        <div class="drop-area">
            <p>Upload File (CSV / Excel)</p>
            <input type="file" id="fileInput">
        </div>

        <div class="buttons">
            <button class="process">Process</button>
            <button class="cancel">Cancel</button>
        </div>

        <div class="loading">
            Loading...
        </div>

        <div class="success">
            ✔ Success Message
        </div>

    </div>

</div>

</body>
</html>
